[project]
name = "polymom"
version = "0.1.0"
description = "Voice-based Minutes of Meeting pipeline: diarization, multilingual ASR (en/hi/or/code-mixed), speaker analytics and LLM summaries."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "filetype>=1.2.0",
    "jinja2>=3.1.6",
    "rapidfuzz>=3.14.6",
    "httpx>=0.28.1",
    "python-docx>=1.2.0",
    "fpdf2>=2.8",
    "uharfbuzz>=0.56.2",
    "arq>=0.28.0",
    "redis>=5",
    "prometheus-client>=0.26.0",
    "limits>=5.8.0",
    "sse-starlette>=3.5.0",
]

[project.optional-dependencies]
# Heavy ML stack, opt-in: `uv sync --extra ml`. Base install stays light.
# torch/torchaudio < 2.9: torchaudio 2.9 removed I/O APIs that pyannote.audio 3.x uses.
ml = [
    "torch>=2.2,<2.9",
    "torchaudio>=2.2,<2.9",
    "pyannote.audio>=3.3,<4",
    "numpy>=1.26",
    "faster-whisper>=1.1",
    "speechbrain>=1.0,<2",
]
# Indic-language models, installed together with `ml` (`uv sync --extra ml --extra indic`):
# Odia ASR (AI4Bharat IndicConformer, ONNX + transformers remote code; no NeMo) and
# the default spoken-language ID model (facebook/mms-lid-126, transformers).
indic = [
    "transformers>=4.44,<5",
    "onnxruntime>=1.18",
]
# Analytics charts (PNG): `uv sync --extra viz`. Without it the chart endpoint returns 503.
viz = ["matplotlib>=3.8"]
# Langfuse tracing of LLM calls (LANGFUSE_ENABLED=true): `uv sync --extra tracing`.
tracing = ["langfuse>=2,<3"]
s3 = [
    "boto3>=1.43.104",
]
postgres = [
    "asyncpg>=0.31.0",
]
otel = [
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "opentelemetry-sdk>=1.45.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "pre-commit>=3.8",
    "jiwer>=3.0",
    "hypothesis>=6.100",
    "matplotlib>=3.8",
    "moto[s3]>=5.2.3",
    "testcontainers[postgres]>=4.15.0",
    "asyncpg>=0.31.0",
    "boto3>=1.43.104",
    "pypdf>=6.19.0",
    "fakeredis>=2.38.0",
    "locust>=2.46.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# CPU wheels by default; see README / docker/Dockerfile for the CUDA variant.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "SIM", "RUF", "ASYNC", "PT"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ASYNC240"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --cov=app --cov-report=term-missing -m 'not slow'"
markers = [
    "slow: needs real models / HF_TOKEN; run with `make test-slow`",
    "llm: calls a real LLM provider; skipped without LLM_API_KEY",
    "postgres: runs against Postgres in Docker (testcontainers); skipped without Docker",
]

[[tool.mypy.overrides]]
module = ["filetype", "filetype.*", "torch", "torch.*", "pyannote.*", "numpy", "numpy.*", "faster_whisper", "faster_whisper.*", "speechbrain", "speechbrain.*", "transformers", "transformers.*", "jiwer", "jiwer.*", "matplotlib", "matplotlib.*", "langfuse", "langfuse.*", "boto3", "boto3.*", "botocore.*", "moto", "moto.*", "testcontainers.*", "docx", "docx.*", "fpdf", "fpdf.*", "pypdf", "opentelemetry", "opentelemetry.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
# SQLAlchemy's asyncio layer resumes code inside greenlets.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
exclude_also = ['if TYPE_CHECKING:', 'raise NotImplementedError', '^\s*\.\.\.$']
