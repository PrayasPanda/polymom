name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install dependencies
        run: uv sync --all-groups --frozen
      - name: Lint
        run: make lint
      - name: Type-check
        run: make typecheck
      - name: Test (unit + integration, coverage gate 85%)
        run: uv run pytest --cov-report=xml --cov-fail-under=85
      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Export locked dependencies
        # torch/torchaudio come from the PyTorch index with local versions (e.g. 2.8.0+cpu)
        # that PyPI's advisory database cannot resolve; audit everything else strictly.
        run: |
          uv export --frozen --no-dev --no-hashes --all-extras --no-emit-project             | grep -Ev '^[A-Za-z0-9_.-]+==[^ ;]*\+' > requirements-audit.txt
          echo "Skipped (local-version wheels):"
          uv export --frozen --no-dev --no-hashes --all-extras --no-emit-project             | grep -E '^[A-Za-z0-9_.-]+==[^ ;]*\+' || true
      - name: pip-audit
        # Temporarily ignored: transformers 4.x advisories (fixed only in transformers >= 5.10).
        # transformers 5 requires huggingface-hub >= 1.5, which removed `use_auth_token`, and
        # pyannote.audio 3.x (diarization) still passes it. The fix is the pyannote 4 +
        # transformers 5 migration, tracked as a follow-up; transformers is only in the
        # optional `indic` extra (Odia ASR, MMS language ID) and loads trusted models.
        # CVE-2026-80047 (4.57.0-5.16.1): load_custom_generate() caches remote code before the
        # consent check. Polymom never calls it and only loads two fixed model ids.
        run: >-
          uvx pip-audit --strict --requirement requirements-audit.txt --no-deps --disable-pip
          --ignore-vuln PYSEC-2025-217
          --ignore-vuln PYSEC-2026-2288
          --ignore-vuln PYSEC-2026-2289
          --ignore-vuln PYSEC-2026-2290
          --ignore-vuln PYSEC-2026-3929
          --ignore-vuln CVE-2026-80047

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
