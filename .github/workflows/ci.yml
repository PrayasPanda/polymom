name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install dependencies
        run: uv sync --all-groups --frozen
      - name: Lint
        run: make lint
      - name: Type-check
        run: make typecheck
      - name: Test
        run: make test

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Export locked dependencies
        # torch/torchaudio come from the PyTorch index with local versions (e.g. 2.8.0+cpu)
        # that PyPI's advisory database cannot resolve; audit everything else strictly.
        run: |
          uv export --frozen --no-dev --no-hashes --all-extras --no-emit-project             | grep -Ev '^[A-Za-z0-9_.-]+==[^ ;]*\+' > requirements-audit.txt
          echo "Skipped (local-version wheels):"
          uv export --frozen --no-dev --no-hashes --all-extras --no-emit-project             | grep -E '^[A-Za-z0-9_.-]+==[^ ;]*\+' || true
      - name: pip-audit
        run: uvx pip-audit --strict --requirement requirements-audit.txt --no-deps --disable-pip

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
