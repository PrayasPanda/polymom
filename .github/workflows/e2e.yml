name: E2E

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install dependencies
        run: uv sync --all-groups --frozen
      - name: Start stack (mock ML backends)
        run: make e2e-up
      - name: End-to-end tests
        run: make e2e
      - name: Stack logs
        if: failure()
        run: docker compose -f docker/docker-compose.yml -f docker/docker-compose.e2e.yml logs --no-color --tail 300
      - name: Tear down
        if: always()
        run: make e2e-down
