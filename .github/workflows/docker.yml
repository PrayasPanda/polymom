name: Docker

# Builds on every PR (no push) so Dockerfile breakage is caught early; pushes to GHCR
# on version tags. Trivy fails the job on fixable CRITICAL vulnerabilities.
on:
  pull_request:
    paths: ["docker/**", "pyproject.toml", "uv.lock", "app/**"]
  push:
    tags: ["v*"]
  workflow_call:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            args: ""
          - variant: cuda
            args: |
              INSTALL_ML=true
              INSTALL_INDIC=true
              TORCH_VARIANT=cu128
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (CUDA image is large)
        if: matrix.variant == 'cuda'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: suffix=${{ matrix.variant == 'cuda' && '-cuda' || '' }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            ${{ matrix.args }}
            VERSION=${{ github.ref_name }}
          load: true
          tags: polymom:scan
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
      - name: Trivy scan (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: polymom:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Trivy SARIF report
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: polymom:scan
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-${{ matrix.variant }}.sarif
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && github.event_name != 'pull_request'
        with:
          sarif_file: trivy-${{ matrix.variant }}.sarif
          category: trivy-${{ matrix.variant }}
      - name: Push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            ${{ matrix.args }}
            VERSION=${{ github.ref_name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
