# API + Postgres + Redis + one worker per resource queue.
#
#   docker compose -f docker/docker-compose.yml up --build
#   docker compose -f docker/docker-compose.yml exec api python -m scripts.create_api_key --label me
#
# Profiles (combine freely):
#   --profile monitoring   Prometheus + Grafana (http://localhost:3000)
#   --profile s3           SeaweedFS S3; set ARTIFACT_STORE=s3 S3_ENDPOINT_URL=http://seaweedfs:8333
#   --profile local-llm    Ollama; set LLM_PROVIDER=ollama OLLAMA_BASE_URL=http://ollama:11434
#   --profile gpu          CUDA worker for the gpu queue (real models, NVIDIA runtime);
#                          add `--scale worker-gpu=0` so the CPU copy does not compete
#
# Defaults run the mock ML backends so the stack works without GPUs or model downloads;
# set INSTALL_ML=true and the *_BACKEND variables in .env for real models.

x-app: &app
  build:
    context: ..
    dockerfile: docker/Dockerfile
    args:
      INSTALL_ML: ${INSTALL_ML:-false}
      INSTALL_INDIC: ${INSTALL_INDIC:-false}
      TORCH_VARIANT: ${TORCH_VARIANT:-cpu}
  image: polymom:latest
  env_file:
    - path: ../.env
      required: false
  environment: &app-env
    APP_ENV: ${APP_ENV:-production}
    STORAGE_DIR: /app/storage
    DATABASE_URL: postgresql+asyncpg://polymom:${POSTGRES_PASSWORD:-polymom}@postgres:5432/polymom
    REDIS_URL: redis://redis:6379/0
    PIPELINE_EXECUTION: queue
    DIARIZATION_BACKEND: ${DIARIZATION_BACKEND:-mock}
    ASR_BACKEND: ${ASR_BACKEND:-mock}
    LID_BACKEND: ${LID_BACKEND:-mock}
    LLM_PROVIDER: ${LLM_PROVIDER:-mock}
    RATE_LIMIT_DEFAULT: ${RATE_LIMIT_DEFAULT:-120/minute}
    RATE_LIMIT_UPLOAD: ${RATE_LIMIT_UPLOAD:-10/minute}
  volumes:
    - storage:/app/storage
    - model-cache:/app/.cache
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: polymom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-polymom}
      POSTGRES_DB: polymom
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polymom"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    <<: *app
    environment:
      <<: *app-env
      AUTO_MIGRATE: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health/ready"]
      interval: 10s
      retries: 12

  worker-cpu:
    <<: *app
    command: ["python", "-m", "app.workers.main", "--queue", "cpu"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9101/metrics"]
      interval: 15s
      retries: 5
    environment:
      <<: *app-env
      AUTO_MIGRATE: "false"
    stop_grace_period: 150s  # > SHUTDOWN_GRACE_SECONDS: finish the chunk and checkpoint
    depends_on:
      api: {condition: service_healthy}  # the API runs the migrations

  worker-gpu:
    <<: *app
    command: ["python", "-m", "app.workers.main", "--queue", "gpu"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9101/metrics"]
      interval: 15s
      retries: 5
    environment:
      <<: *app-env
      AUTO_MIGRATE: "false"
      QUEUE_CONCURRENCY_GPU: ${QUEUE_CONCURRENCY_GPU:-1}
    stop_grace_period: 150s
    depends_on:
      api: {condition: service_healthy}

  # --- optional: CUDA worker with the real models (profile gpu) ---
  worker-gpu-cuda:
    <<: *app
    profiles: ["gpu"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        INSTALL_ML: "true"
        INSTALL_INDIC: "true"
        TORCH_VARIANT: ${TORCH_VARIANT_GPU:-cu128}
    image: polymom:cuda
    command: ["python", "-m", "app.workers.main", "--queue", "gpu"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9101/metrics"]
      interval: 15s
      retries: 5
    environment:
      <<: *app-env
      AUTO_MIGRATE: "false"
      DEVICE: cuda
      DIARIZATION_BACKEND: ${DIARIZATION_BACKEND_GPU:-pyannote}
      ASR_BACKEND: ${ASR_BACKEND_GPU:-real}
      LID_BACKEND: ${LID_BACKEND_GPU:-mms}
    stop_grace_period: 150s
    depends_on:
      api: {condition: service_healthy}
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]

  worker-llm:
    <<: *app
    command: ["python", "-m", "app.workers.main", "--queue", "llm"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9101/metrics"]
      interval: 15s
      retries: 5
    environment:
      <<: *app-env
      AUTO_MIGRATE: "false"
    stop_grace_period: 150s
    depends_on:
      api: {condition: service_healthy}

  # --- optional: S3-compatible artifact store (profile s3, ARTIFACT_STORE=s3) ---
  # SeaweedFS (Apache-2.0): MinIO stopped publishing community images in 2025.
  # Dev setup without S3 auth; use real credentials (or AWS S3) in production.
  seaweedfs:
    image: chrislusf/seaweedfs:latest@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    profiles: ["s3"]
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333"]
    ports: ["8333:8333"]
    volumes: [s3-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null"]
      interval: 5s
      retries: 20

  s3-init:
    image: chrislusf/seaweedfs:latest@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    profiles: ["s3"]
    depends_on:
      seaweedfs: {condition: service_healthy}
    entrypoint: ["sh", "-c", "echo 's3.bucket.create -name ${S3_BUCKET:-polymom}' | weed shell -master=seaweedfs:9333"]

  # --- optional: local LLM (profile local-llm) ---
  ollama:
    image: ollama/ollama:0.35.1
    profiles: ["local-llm"]
    volumes: [ollama-data:/root/.ollama]
    ports: ["11434:11434"]

  # --- optional: monitoring ---
  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: ["monitoring"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:13.2.3
    profiles: ["monitoring"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  storage:
  model-cache:
  postgres-data:
  redis-data:
  s3-data:
  ollama-data:
