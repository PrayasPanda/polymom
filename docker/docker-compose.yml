services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # true installs torch + pyannote.audio for real diarization
        INSTALL_ML: ${INSTALL_ML:-false}
        # true adds the Odia ASR runtime (use together with INSTALL_ML=true)
        INSTALL_INDIC: ${INSTALL_INDIC:-false}
        TORCH_VARIANT: ${TORCH_VARIANT:-cpu}
    image: polymom:latest
    env_file:
      - path: ../.env
        required: false
    environment:
      STORAGE_DIR: /app/storage
    ports:
      - "8000:8000"
    volumes:
      - storage:/app/storage
      # Hugging Face / torch model downloads (pyannote, Whisper, IndicConformer),
      # reused across restarts and rebuilds
      - model-cache:/app/.cache
    restart: unless-stopped

  # Optional S3-compatible artifact store:
  #   docker compose -f docker/docker-compose.yml --profile minio up
  # with ARTIFACT_STORE=s3 S3_ENDPOINT_URL=http://minio:9000 S3_BUCKET=polymom
  #      S3_ACCESS_KEY=polymom S3_SECRET_KEY=polymom-secret in .env
  minio:
    image: minio/minio:latest
    profiles: ["minio"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-polymom}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-polymom-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      retries: 5

  minio-init:
    image: minio/mc:latest
    profiles: ["minio"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-polymom}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-polymom-secret}
      S3_BUCKET: ${S3_BUCKET:-polymom}
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 $${S3_ACCESS_KEY:-polymom} $${S3_SECRET_KEY:-polymom-secret}
      && mc mb --ignore-existing local/$${S3_BUCKET:-polymom}"

volumes:
  storage:
  model-cache:
  minio-data:
